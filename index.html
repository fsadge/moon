<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>中秋快乐 粒子动画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ========== 可自定义参数 ==========
const DANMU_COUNT = 260;        // 弹幕数量，统一后260更稳
const TEXT_SEQUENCE = [
  "3","2","1",
  "中秋佳节快乐",
  "皓月同心",
  "共赴此婵娟",
  "中秋月圆",
  "愿在往后年年岁岁",
  "岁岁平安万事胜意",
  "好运满满"
];
const TEXT_DURATION = 2200;     // 每个文字停留毫秒
const PARTICLE_STEP = 4;        // 粒子密度，越小越密
const DANMU_COLOR = "#ff88bb"; // 弹幕粉色
const PARTICLE_COLOR = "#ffffff";

// 弹幕统一样式参数
const DANMU_FONT_SIZE = 20;
const DANMU_SPEED = 2.8;        // 统一基础速度
const DANMU_ALPHA = 0.65;       // 统一透明度
const GRADIENT_FADE_HEIGHT = 320; // 底部渐变消失高度
const STAGGER_DELAY = 0.016;    // 每个弹幕错开入场时间，秒
// =================================

// 弹幕对象：统一样式、分批入场、底部渐变消失
class Danmu{
  constructor(index){
    this.text = "中秋快乐❤️";
    this.x = Math.random() * canvas.width;
    this.speed = DANMU_SPEED + Math.random() * 0.6;
    this.alpha = DANMU_ALPHA;

    // 初始位置在屏幕外，按序号分批出现，避免刷新瞬间一堆
    this.y = -150 - index * STAGGER_DELAY * DANMU_SPEED * 60;

    this.font = `bold ${DANMU_FONT_SIZE}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  }

  update(){
    this.y += this.speed;

    // 滚出底部后从顶部重新进入
    if(this.y > canvas.height + 150){
      this.y = -150;
      this.x = Math.random() * canvas.width;
    }
  }

  getCurrentAlpha(){
    const fadeStart = canvas.height - GRADIENT_FADE_HEIGHT;
    if(this.y > fadeStart){
      const progress = (this.y - fadeStart) / GRADIENT_FADE_HEIGHT;
      return Math.max(0, this.alpha - progress * this.alpha);
    }
    return this.alpha;
  }

  draw(){
    const alpha = this.getCurrentAlpha();
    if(alpha <= 0) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = DANMU_COLOR;
    ctx.font = this.font;
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.PI / 2);
    ctx.fillText(this.text, 0, 0);
    ctx.restore();
  }
}

const danmus = [];
for(let i = 0; i < DANMU_COUNT; i++){
  danmus.push(new Danmu(i));
}

// 粒子系统
class Particle{
  constructor(){
    this.x = 0;
    this.y = 0;
    this.targetX = 0;
    this.targetY = 0;
    this.vx = 0;
    this.vy = 0;
    this.blink = Math.random() * Math.PI * 2;
    this.radius = 1.5 + Math.random() * 1.2;
  }

  setTarget(tx, ty){
    this.targetX = tx;
    this.targetY = ty;
    this.x = tx + (Math.random() - 0.5) * 220;
    this.y = ty + (Math.random() - 0.5) * 220;
  }

  update(){
    this.vx = (this.targetX - this.x) * 0.08;
    this.vy = (this.targetY - this.y) * 0.08;
    this.x += this.vx;
    this.y += this.vy;
    this.blink += 0.06;
  }

  draw(){
    const a = 0.6 + 0.4 * Math.sin(this.blink);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = PARTICLE_COLOR;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

let particles = [];

// 根据文字生成点阵粒子
function createTextParticles(text){
  particles = [];
  const tempCanvas = document.createElement("canvas");
  const tctx = tempCanvas.getContext("2d");
  const fontSize = Math.min(90, canvas.width / (text.length + 1));
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  tctx.fillStyle = "#fff";
  tctx.font = `bold ${fontSize}px sans-serif`;
  tctx.textAlign = "center";
  tctx.textBaseline = "middle";
  tctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const imgData = tctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
  const data = imgData.data;

  for(let y = 0; y < tempCanvas.height; y += PARTICLE_STEP){
    for(let x = 0; x < tempCanvas.width; x += PARTICLE_STEP){
      const idx = (y * tempCanvas.width + x) * 4;
      if(data[idx + 3] > 128){
        const p = new Particle();
        p.setTarget(x, y);
        particles.push(p);
      }
    }
  }
}

// 字幕时序
let currentIndex = 0;
let lastSwitch = performance.now();
createTextParticles(TEXT_SEQUENCE[0]);

function loop(time){
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for(const d of danmus){
    d.update();
    d.draw();
  }

  if(time - lastSwitch > TEXT_DURATION){
    currentIndex = (currentIndex + 1) % TEXT_SEQUENCE.length;
    createTextParticles(TEXT_SEQUENCE[currentIndex]);
    lastSwitch = time;
  }

  for(const p of particles){
    p.update();
    p.draw();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
